spring.application.name=booking-service
server.port=8082

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking_db}
spring.datasource.username=${DATASOURCE_USERNAME:reservas}
spring.datasource.password=${DATASOURCE_PASSWORD:reservas123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

room.service.url=${ROOM_SERVICE_URL:http://localhost:8081}
user.service.url=${USER_SERVICE_URL:http://localhost:8083}