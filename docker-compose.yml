services:

  postgres:
    image: postgres:16
    container_name: postgres-reservas
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reservas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservas123}
      POSTGRES_DB: reservas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservas}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - reservas-network

  auth-service:
    build: ./auth-service/auth-service
    ports:
      - "8084:8084"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      DATASOURCE_USERNAME: ${POSTGRES_USER:-reservas}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reservas123}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URI: http://localhost:8080/auth/github/callback
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservas-network

  room-service:
    build: ./room-service/room-service
    ports:
      - "8081:8081"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/room_db
      DATASOURCE_USERNAME: ${POSTGRES_USER:-reservas}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reservas123}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservas-network

  user-service:
    build: ./user-service/user-service
    ports:
      - "8083:8083"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      DATASOURCE_USERNAME: ${POSTGRES_USER:-reservas}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reservas123}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservas-network

  booking-service:
    build: ./booking-service/booking-service
    ports:
      - "8082:8082"
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      DATASOURCE_USERNAME: ${POSTGRES_USER:-reservas}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-reservas123}
      ROOM_SERVICE_URL: http://room-service:8081
      USER_SERVICE_URL: http://user-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      room-service:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - reservas-network

  api-gateway:
    build: ./api-gateway/api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: http://auth-service:8084
      ROOM_SERVICE_URL: http://room-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      USER_SERVICE_URL: http://user-service:8083
    depends_on:
      - auth-service
      - room-service
      - booking-service
      - user-service
    networks:
      - reservas-network

volumes:
  postgres-data:

networks:
  reservas-network:
    driver: bridge