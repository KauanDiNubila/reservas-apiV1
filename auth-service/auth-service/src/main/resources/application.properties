spring.application.name=auth-service
server.port=8084

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${DATASOURCE_USERNAME:reservas}
spring.datasource.password=${DATASOURCE_PASSWORD:reservas123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:troque-por-um-secret-de-pelo-menos-64-caracteres-em-base64-aqui}
jwt.expiration=${JWT_EXPIRATION:86400000}

github.client-id=${GITHUB_CLIENT_ID:seu-github-client-id}
github.client-secret=${GITHUB_CLIENT_SECRET:seu-github-client-secret}
github.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:8080/auth/github/callback}
